name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests and example map
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test
      - name: The committed example map is current
        working-directory: Example
        run: |
          swift run --package-path .. tca-navmap AppFeature --sources Sources --ignore Launcher --screen-name-modifier trackScreen
          git diff --exit-code -- navigation-map
